# Runs only the tests marked slow, started by hand from the Actions tab ("Run workflow", choose the branch)
name: sunrise-slow-tests

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install basic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fqe --no-deps
          pip install git+https://github.com/davibinco/TenCirChem-NG.git
      - name: Test slow tests
        env:
          # see ci_basic.yml
          GLIBC_TUNABLES: glibc.rtld.optional_static_tls=4096
          OMP_NUM_THREADS: 1
        run: |
          pip install -e .
          pip install pytest pytest-xdist
          cd tests
          pytest -m slow --slow -n auto --durations=0
