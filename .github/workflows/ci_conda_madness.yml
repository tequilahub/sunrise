# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test-Madness with special conda installer

on:
  push:
    branches: [ master, devel ]
  pull_request:
    branches: [ master, devel ]

jobs:

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install prerequisites Ubuntu packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build g++-13 libblis4-serial liblapack-dev liblapack3 libboost-dev libboost-serialization-dev libeigen3-dev
    - name: Install basic python dependencies
      run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
    - name: Install and test frayedends with madness
      run: |
        git clone https://github.com/m-a-d-n-e-s-s/madness madness_source
        mkdir madness_build
        export MADNESS_DIR=$(realpath madness)
        cmake \
          -D CMAKE_INSTALL_PREFIX=$MADNESS_DIR \
          -D ENABLE_MPI=OFF \
          -D CMAKE_CXX_COMPILER=/usr/bin/g++-13 \
          -D CMAKE_CXX_FLAGS="-O3 -DNDEBUG" \
          -D LAPACK_LIBRARIES="/usr/lib/x86_64-linux-gnu/libblis.so.4;/usr/lib/x86_64-linux-gnu/liblapack.so" \
          -S madness_source -B madness_build
        make -C madness_build -j$(nproc)
        sudo cmake --build madness_build/ --target install -j$(nproc)
        git clone https://github.com/FabianLangkabel/FrayedEnds.git FrayedEnds
        cd FrayedEnds/
        MADNESS_DIR=$MADNESS_DIR pip install -e .
        python -m pip install pytest
        cd ../tests
        pytest test_chemistry_madness.py
        pytest test_chemistry.py -k madness
        cd ../

